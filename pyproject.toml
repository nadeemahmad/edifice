[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-os"
version = "0.1.0"
description = "Local operational kernel for an Obsidian-centered personal system."
requires-python = ">=3.13,<3.15"
dependencies = [
  "click>=8.2,<9",
]

[project.scripts]
personal-os = "personal_os.cli:cli"

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "pytest>=8.4,<9",
  "pyright>=1.1.404,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_os"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
